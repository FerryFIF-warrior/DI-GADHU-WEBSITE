<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Di-Gadhu</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>

        :root {
            --dark-green: #1f3d2b;
            --forest-green: #2f5d3a;
            --leaf-green: #4f8a5b;
            --light-green: #8ccf9b;
            --water-blue: #4aa3c7;
            --soil-brown: #8b6b4c;
            --soft-cream: #f4f1e6;
        }

        .bg-dark-green {background-color: var(--dark-green);}
        .bg-forest-green {background-color: var(--forest-green);}
        .bg-leaf-green {background-color: var(--leaf-green);}
        .bg-light-green {background-color: var(--light-green);}
        .bg-water-green {background-color: var(--water-blue);}
        .bg-soil-brown {background-color: var(--soil-brown);}
        .bg-soft-cream {background-color: var(--soft-cream);}

        .text-dark-green {color: var(--dark-green);}
        .text-forest-green {color: var(--forest-green);}
        .text-leaf-green {color: var(--leaf-green);}
        .text-light-green {color: var(--light-green);}
        .text-water-green {color: var(--water-blue);}
        .text-soil-brown {color: var(--soil-brown);}
        .text-soft-cream {color: var(--soft-cream);}

        .boder-dark-green {border-color: var(--dark-green);}
        .boder-forest-green {border-color: var(--forest-green);}
        .boder-leaf-green {border-color: var(--leaf-green);}
        .boder-light-green {border-color: var(--light-green);}
        .boder-water-green {border-color: var(--water-blue);}
        .boder-soil-brown {border-color: var(--soil-brown);}
        .boder-soft-cream {border-color: var(--soft-cream);}

        .hover-bg-forest-green:hover {background-color: var(--forest-green);}
        .hover-bg-leaf-green:hover {background-color: var(--leaf-green);}
        .hover-text-light-green:hover {background-color: var(--light-green);}

        .focus-ring-light-green:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--light-green);
        }
    </style>
</head>
<body class="bg-soft-cream font-sans">

    <nav class="bg-dark-green/ 70 backdrop-blur-sm fixed w-full z-10 p-4 flex justify-between items-center text-light-green">
        <div class="flx item-center gap-2">
            <img src="Resource/Logo2.png" alt="logo" class="x-10 h-10 object-contain">
            <h2 class="text-forest-green tracking-wide">DI-GADHU</h2>
        </div>
        <ul class="flex gap-6">
            <li><a href="index.HTML" class="hover:text-light-green">Beranda</a></li>
            <li><a href="login.HTML" class="text-light-green font-semibold">Login</a></li>
        </ul>
    </nav>
    <div class="min-h-screen flex items-center justify-center px-4 pt-20">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-light-green">
            <div class="text-center mb-8">
                <img src="Resource/Logo2.png" alt="Logo" class="w-20 h-20 mx-auto mb-3">
                <h2 class="text-3x1 font-bold text-dark-green">Masuk ke DI-GADHU</h2>
                <p class="text-gray-600 mt-2">Silahkan masuk untuk melanjutkan</p>
            </div>

            <form>
                
                <!--Email-->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">Email</label>
                    <input type="email" placeholder="contoh@email.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-light-green focus:border-transparent">
                </div>

                <!--password-->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">Kata Sandi</label>
                    <input type="password" placeholder="*********" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-light-green focus:border-transparent">
                </div>

                <!--ingat login-->
                <div class="flex item-center justify-between mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" class="rounded border-gray-300 text-forest-green focus:ring-light-green">
                        <span class="ml-2 text-gray-600">Ingat saya</span>
                    </label>
                    <a href="#" class="text-sm text-forest-green hover:underline">Lupa password?</a>
                </div>

                <!--Login-->
                <button type="submit" class="w-full bg-forest-green hover:bg-leaf-green text-white font-semibold py-3 rounded-lg transition duration-300">Masuk</button>
            </form>

            <p class="text-center text-gray-600 mt-6">Belum punya akun?
                <a href="#" class="text-forest-green font-semibold hover:underline">Daftar</a>
            </p>
        </div>
    </div>
    <footer class="bg-dark-green text-white text-center py-4 mt-10">
        <p>Ferry Iqbal Fuadi | V3925006 | Web Programing | 2026</p>
    </footer>
</body>
</html>
